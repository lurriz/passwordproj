<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>PassMaker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1 class="header">Generate Password</h1>

    {% set active_page = "generator" %}
    {% include "_sidebar.html" %}

    <div class="button-group">
        <button class="btn" id="generate">Generate</button>
        <button class="btn" id="copy-clipboard">Copy</button>
        <button class="btn" id="save-to-DB">Save to DB</button>
        
    </div>
    
    <div class="input-group">
        <input class="input" type="text" id="length" placeholder="Length (default 16)">
        <input class="input" type="text" id="site" placeholder="site">
        <input class="input" type="text" id="username" placeholder="username">      
    </div>
    <div>
        <input class="box" type="text" id="output" placeholder="password">
    </div>

    <p id="generator-message" class="generator-message"></p>

    <script src="{{ url_for('static', filename='generator.js') }}"></script>
</body>
</html>
