<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
     <h1 class="header" id="vault-head">Password Vault</h1>

    <nav class="sidebar">
        <a href="/">Home</a>
        <a href="/vault">Vault</a>
        <a href="/settings">Settings</a>
        <a href="/logout" class="logout-link">Logout</a>
    </nav>
    
    <div class="input-group-vault">
        <input class="input" type="text" id="site" placeholder="site" autocomplete="off">
        <input class="input" type="text" id="username" placeholder="username" autocomplete="username">     
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Site</th>
                    <th>Username</th>
                </tr>
            </thead>
            <tbody id="vault-data"></tbody>
        </table>
    </div>

    <div id="entry-side-panel" class="side-panel hidden">
        <button id="close-side-panel" class="side-panel-close">X</button>

        <h2>Entry Details</h2>

        <p id="entry-id"></p>
        <p id="entry-site"></p>
        <p id="entry-username"></p>
        <p id="entry-password"></p>
        <button class="btn" id="reveal-password">Reveal password</button>
        <button class="btn" id="copy-password">Copy password</button>
        <button class="btn" id="edit-entry">Edit</button>
        <button class="btn" id="delete-entry">delete</button>
        <p id="side-message" class="side-message"></p>
    </div>

    <div id="edit-overlay" class="edit-overlay hidden"></div>

    <div id="edit-popup" class="edit-popup hidden">
        <button id="close-edit-popup" class="side-panel-close">X</button>

        <p id="edit-entry-id"></p>

        <input class="input" type="text" id="site-edit" value="">
        <input class="input" type="text" id="username-edit" value="">
        <input class="input" type="text" id="password-edit" value="">

        <button class="btn" id="save-entry-change">Save</button>
    </div>

       <div id="delete-popup" class="delete-popup hidden">
        <button id="close-delete-popup" class="delete-popup-close">X</button>

        <h2>Are you sure you want to delete this entry?</h2>

        <p id="delete-entry-id"></p>
        <p id="delete-entry-site"></p>
        <p id="delete-entry-username"></p>
        <p id="delete-entry-password"></p>

        <button class="btn" id="confirm-delete-entry">Yes</button>
    </div>
        
    <script src="{{ url_for('static', filename='vault.js') }}"></script>
</body>
</html>
